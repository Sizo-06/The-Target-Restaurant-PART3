<style>
.gallery{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
.gallery img{width:100%; cursor:pointer; border-radius:8px; transition:0.3s}
.gallery img:hover{transform:scale(1.05)}
#lightbox{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); justify-content:center; align-items:center; z-index:999;}
#lightbox img{max-width:100%; max-height:100%;}
</style>
<div class="gallery">
  <img src="_images/Catering.jpg" alt="catery from The Target" class="g-img">
  <img src="_images/Delivery.jpg" alt="Food Delivery at The Target" class="g-img">
  <img src="_images/Dine in (2).jpg" alt="Interior of Target Restaurant family dining" class="g-img">
</div>
<div id="lightbox"><img id="lb-img"></div>
<script>
document.querySelectorAll('.g-img').forEach(i=>i.addEventListener('click',function(){
  document.getElementById('lb-img').src=this.src;
  document.getElementById('lightbox').style.display='flex';
}));
document.getElementById('lightbox').addEventListener('click',function(){this.style.display='none'});
</script>
